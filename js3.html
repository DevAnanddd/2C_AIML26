<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product Information</title>

<script>

let product={
p_id:101,
p_name:"duster",
p_price:100000,
p_quantity:10,

cost:function(){
return this.p_price*this.p_quantity;
}
};

function showData(){
document.getElementById("productDetails").innerHTML=
"<p>Product ID: "+product.p_id+"</p>"+
"<p>Product Name: "+product.p_name+"</p>"+
"<p>Product Price: ₹"+product.p_price+"</p>"+
"<p>Product Quantity: "+product.p_quantity+"</p>"+
"<p>Total Cost: ₹"+product.cost()+"</p>";
}

function changeQuantity(){
let q=document.getElementById("quantity").value;

if(q>=0){
product.p_quantity=q;
showData();
}
}

window.onload=function(){
showData();
};

</script>
</head>

<body>

<h1>Product Information</h1>

<div id="productDetails"></div>

<label>Update Quantity:</label>

<input type="number" id="quantity" min="0" value="10">

<button onclick="changeQuantity()">Update Quantity</button>

</body>
</html>
