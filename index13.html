<!DOCTYPE html>
<html>
<head>
    <title>Employee and Manager Payroll System</title>
</head>
<body>

    <h2>Employee and Manager Payroll System</h2>

    <script>
        class Employee {
            constructor(id, name, basicSalary) {
                this.id = id;
                this.name = name;
                this.basicSalary = basicSalary;
            }

            calculateSalary() {
                return this.basicSalary;
            }
        }

        class incentive {
            constructor(id, name, basicSalary, incentive) {
                super(id, name, basicSalary);
                this.incentive = incentive;
            }

            calculateSalary() {
                return this.basicSalary + this.incentive;
            }
        }


        let employee = new Employee(101, "Rahul", 30000);
        let manager = new Manager(102, "Amit", 50000, 10000);

        document.write("Employee Name: " + employee.name + "<br>");
        document.write("Employee Salary: ₹" + employee.calculateSalary() + "<br><br>");

        document.write("Manager Name: " + manager.name + "<br>");
        document.write("Manager Salary: ₹" + manager.calculateSalary());


    </script>

</body>
</html>
