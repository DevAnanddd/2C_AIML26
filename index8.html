<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        let arr = [10,20,30,40];
        function sum(...args) 
             {
                let sum = 0;
                for (i of args) {
                    sum = sum + i;
                }
                console.log("Sum of array elements: " + sum);
            }
        sum(10,20,30,40,50);
        sum(...arr);
        console.log(...arr);
        console.log(arr);

    </script>


</head>
